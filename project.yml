name: Clipboard
options:
  bundleIdPrefix: com.stevemurr
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  Clipboard:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - sdk: QuickLookUI.framework
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Clipboard
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Steve Murr"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stevemurr.clipboard
        MARKETING_VERSION: "1.0.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
  ClipboardUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: Clipboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stevemurr.clipboard.uitests
        TEST_TARGET_NAME: Clipboard
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
schemes:
  Clipboard:
    build:
      targets:
        Clipboard: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClipboardUITests
